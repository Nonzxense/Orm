name: Build and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
      - "README.md"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build Changed Services
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Detect changed services
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Frontend Metadata
        if: steps.filter.outputs.frontend == 'true'
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nonzxense/orm-frontend
          tags: |
            type=sha,format=long,prefix=

      - name: Build Frontend
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ==========================================
      # BACKEND
      # ==========================================

      - name: Backend Metadata
        if: steps.filter.outputs.backend == 'true'
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nonzxense/orm-backend
          tags: |
            type=sha,format=long,prefix=

      - name: Build Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ==========================================
      # UPDATE KUBERNETES MANIFEST
      # ==========================================

      - name: Setup Kustomize
        if: github.event_name == 'push' && (steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true')
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes Image Tags
        if: github.event_name == 'push' && (steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true')
        run: |
          cd k8s

          if [ "${{ steps.filter.outputs.frontend }}" == "true" ]; then
            kustomize edit set image \
              ghcr.io/nonzxense/orm-frontend=ghcr.io/nonzxense/orm-frontend:${{ steps.frontend_meta.outputs.version }}
          fi

          if [ "${{ steps.filter.outputs.backend }}" == "true" ]; then
            kustomize edit set image \
              ghcr.io/nonzxense/orm-backend=ghcr.io/nonzxense/orm-backend:${{ steps.backend_meta.outputs.version }}
          fi

          cat kustomization.yaml

      # ==========================================
      # COMMIT AND PUSH
      # ==========================================

      - name: Commit and Push Changes
        if: github.event_name == 'push' && (steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "deploy: update image tags [skip ci]"

            success=false

            for i in {1..5}; do
              echo "Attempt $i to push changes..."

              git pull origin main --rebase

              if git push origin main; then
                echo "Successfully pushed changes!"
                success=true
                break
              fi

              echo "Push failed. Retrying in 3 seconds..."
              sleep 3
            done

            if [ "$success" = false ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          else
            echo "No manifest changes."
          fi
