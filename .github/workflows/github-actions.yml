name: Build and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'README.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orm-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service == 'frontend' && 'frontend' || 'backend' }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_API_URL=${{ matrix.service == 'frontend' && '/api' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Setup Kustomize
        if: github.event_name == 'push'
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes Manifest Tag
        if: github.event_name == 'push'
        run: |
          cd k8s/apps/${{ matrix.service }}
          kustomize edit set image ghcr.io/${{ github.repository_owner }}/orm-${{ matrix.service }}=ghcr.io/${{ github.repository_owner }}/orm-${{ matrix.service }}:${{ steps.meta.outputs.version }}

      - name: Commit and Push Changes with Retry Logic
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
  
          git add k8s/apps/${{ matrix.service }}/kustomization.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "deploy: update ${{ matrix.service }} image tag to ${{ steps.meta.outputs.version }} [skip ci]"
            
            success=false
            for i in {1..5}; do
              echo "Attempt $i to push changes..."
              git pull origin main --rebase
              
              if git push origin main; then
                echo "Successfully pushed changes!"
                success=true
                break
              else
                echo "Push failed due to race condition. Retrying in 3 seconds..."
                sleep 3
              fi
            done
            
            if [ "$success" = false ]; then
              echo "Error: Failed to push changes after 5 attempts."
              exit 1
            fi
          else
            echo "No changes to commit for ${{ matrix.service }}"
          fi
