name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  build_frontend:
    name: Build Frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nonzxense/orm-frontend
          tags: |
            type=sha,format=long,prefix=

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build_backend:
    name: Build Backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nonzxense/orm-backend
          tags: |
            type=sha,format=long,prefix=

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Update Kubernetes Manifests
    needs:
      - detect
      - build_frontend
      - build_backend
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.detect.result == 'success' &&
      (needs.build_frontend.result == 'success' || needs.build_frontend.result == 'skipped') &&
      (needs.build_backend.result == 'success' || needs.build_backend.result == 'skipped')
    runs-on: ubuntu-latest

    # Serialize writes to the shared Kustomize manifest.
    # The per-service commit checks below prevent an older build from
    # overwriting a newer image for the same service.
    concurrency:
      group: orm-k8s-manifest-main
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update, Validate, and Push Manifest
        env:
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          FRONTEND_TAG: ${{ needs.build_frontend.outputs.image_tag }}
          BACKEND_TAG: ${{ needs.build_backend.outputs.image_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in {1..5}; do
            echo "Deployment attempt ${attempt}"

            # Start each attempt from the latest main branch.
            git fetch origin main
            git reset --hard origin/main

            FRONTEND_DEPLOY=false
            BACKEND_DEPLOY=false

            # Compare the latest commit affecting each service with the
            # service state used by this workflow. This allows an older
            # frontend workflow to deploy even if a newer commit changed
            # only the backend, while preventing stale frontend deployment.
            if [[ "$FRONTEND_CHANGED" == "true" ]]; then
              SOURCE_FRONTEND_COMMIT="$(git log -1 --format=%H "$SOURCE_SHA" -- frontend)"
              LATEST_FRONTEND_COMMIT="$(git log -1 --format=%H origin/main -- frontend)"

              if [[ -n "$SOURCE_FRONTEND_COMMIT" &&
                    "$SOURCE_FRONTEND_COMMIT" == "$LATEST_FRONTEND_COMMIT" ]]; then
                FRONTEND_DEPLOY=true
              else
                echo "Skipping stale frontend image."
              fi
            fi

            if [[ "$BACKEND_CHANGED" == "true" ]]; then
              SOURCE_BACKEND_COMMIT="$(git log -1 --format=%H "$SOURCE_SHA" -- backend)"
              LATEST_BACKEND_COMMIT="$(git log -1 --format=%H origin/main -- backend)"

              if [[ -n "$SOURCE_BACKEND_COMMIT" &&
                    "$SOURCE_BACKEND_COMMIT" == "$LATEST_BACKEND_COMMIT" ]]; then
                BACKEND_DEPLOY=true
              else
                echo "Skipping stale backend image."
              fi
            fi

            cd k8s

            if [[ "$FRONTEND_DEPLOY" == "true" ]]; then
              kustomize edit set image \
                ghcr.io/nonzxense/orm-frontend=ghcr.io/nonzxense/orm-frontend:${FRONTEND_TAG}
            fi

            if [[ "$BACKEND_DEPLOY" == "true" ]]; then
              kustomize edit set image \
                ghcr.io/nonzxense/orm-backend=ghcr.io/nonzxense/orm-backend:${BACKEND_TAG}
            fi

            # Validate the rendered Kubernetes resources before committing.
            kustomize build . > /tmp/orm-manifest.yaml
            cd ..

            git diff --check
            git add k8s/kustomization.yaml

            if git diff --cached --quiet; then
              echo "No manifest changes to commit."
              exit 0
            fi

            git commit -m "deploy: update image tags"

            if git push origin HEAD:main; then
              echo "Manifest update pushed successfully."
              exit 0
            fi

            echo "Push rejected. Will retry from the latest main branch."

            if [[ "$attempt" -lt 5 ]]; then
              sleep 3
            fi
          done

          echo "Failed to update manifest after 5 attempts."
          exit 1
