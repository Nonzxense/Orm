apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orm
  namespace: orm
spec:
  ingressClassName: traefik
  rules:
    - host: orm.home.arpa
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
